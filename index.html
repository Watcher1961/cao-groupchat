<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAO 项目群</title>
<script>/* 尽早应用主题，避免闪烁 */try{const t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch{}</script>
<style>
/* ═════════════ 设计令牌（浅色） ═════════════ */
:root{
  color-scheme:light;
  --bg:#f4f4f6; --surface:#ffffff; --surface-2:#f7f7f9; --surface-3:#ececf0; --hover:rgba(20,20,40,.04);
  --line:#e7e7ec; --line-strong:#d8d8df;
  --ink:#17171c; --ink-2:#3d3d47; --muted:#6f6f7b; --faint:#a3a3ad;
  --accent:#5b5bd6; --accent-2:#4a4ac2; --accent-ink:#ffffff; --accent-soft:rgba(91,91,214,.09); --accent-line:rgba(91,91,214,.28);
  --ok:#1f9d55; --busy:#d48a0a; --bad:#d93a3a; --warn:#b15f0b; --warn-soft:#fff5e6; --warn-line:#f3dfbc;
  --code-bg:#f5f5f8; --pre-bg:#16161b; --pre-ink:#e6e6ee;
  --tool:#eef0fb; --tool-ink:#4547a8; --tool-w:#fdf0e3; --tool-w-ink:#9a4f0c;
  --wall:#e9eaf3; --wall-dot:rgba(70,70,140,.10); --wall-glow:rgba(123,123,242,.16); --wall-glow2:rgba(80,170,200,.10);
  --bub:#ffffff; --bub-ink:#1d1d24; --bub-meta:#9a9aa8; --bub-shadow:0 1px 1.5px rgba(30,30,70,.13);
  --own:#dfe0fb; --own-ink:#17172a; --own-meta:#6a6bb4; --own-mention:#3f40b8; --own-code:rgba(70,70,180,.10);
  --svc:rgba(50,52,96,.36); --svc-ink:#ffffff; --svc-warn:rgba(200,110,20,.82);
  --shadow-sm:0 1px 2px rgba(16,16,32,.05);
  --shadow-lg:0 24px 64px -12px rgba(16,16,40,.28),0 0 0 1px rgba(16,16,40,.06);
  --r-sm:6px; --r:9px; --r-lg:14px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --mono:"SF Mono","JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
/* 深色：跟随系统，或手动指定 */
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0c0c0f; --surface:#131317; --surface-2:#18181d; --surface-3:#222229; --hover:rgba(255,255,255,.035);
  --line:#24242b; --line-strong:#32323b;
  --ink:#ececf1; --ink-2:#c5c5ce; --muted:#8c8c98; --faint:#5d5d68;
  --accent:#7b7bf2; --accent-2:#8f8ff6; --accent-ink:#ffffff; --accent-soft:rgba(123,123,242,.13); --accent-line:rgba(123,123,242,.35);
  --ok:#3fcf7f; --busy:#f0b03c; --bad:#f06161; --warn:#f0a94c; --warn-soft:rgba(240,169,76,.09); --warn-line:rgba(240,169,76,.25);
  --code-bg:#1e1e25; --pre-bg:#0a0a0d; --pre-ink:#dcdce6;
  --tool:rgba(123,123,242,.12); --tool-ink:#a9aaf8; --tool-w:rgba(240,169,76,.12); --tool-w-ink:#f0b46c;
  --wall:#0e0e14; --wall-dot:rgba(140,140,255,.07); --wall-glow:rgba(123,123,242,.10); --wall-glow2:rgba(60,150,190,.06);
  --bub:#1d1d25; --bub-ink:#e6e6ee; --bub-meta:#7c7c8a; --bub-shadow:0 1px 1.5px rgba(0,0,0,.4);
  --own:#4a4ab0; --own-ink:#f4f4ff; --own-meta:rgba(235,235,255,.62); --own-mention:#dcdcff; --own-code:rgba(255,255,255,.14);
  --svc:rgba(255,255,255,.08); --svc-ink:#c9c9d6; --svc-warn:rgba(200,120,30,.55);
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow-lg:0 24px 64px -12px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.06);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0c0c0f; --surface:#131317; --surface-2:#18181d; --surface-3:#222229; --hover:rgba(255,255,255,.035);
  --line:#24242b; --line-strong:#32323b;
  --ink:#ececf1; --ink-2:#c5c5ce; --muted:#8c8c98; --faint:#5d5d68;
  --accent:#7b7bf2; --accent-2:#8f8ff6; --accent-ink:#ffffff; --accent-soft:rgba(123,123,242,.13); --accent-line:rgba(123,123,242,.35);
  --ok:#3fcf7f; --busy:#f0b03c; --bad:#f06161; --warn:#f0a94c; --warn-soft:rgba(240,169,76,.09); --warn-line:rgba(240,169,76,.25);
  --code-bg:#1e1e25; --pre-bg:#0a0a0d; --pre-ink:#dcdce6;
  --tool:rgba(123,123,242,.12); --tool-ink:#a9aaf8; --tool-w:rgba(240,169,76,.12); --tool-w-ink:#f0b46c;
  --wall:#0e0e14; --wall-dot:rgba(140,140,255,.07); --wall-glow:rgba(123,123,242,.10); --wall-glow2:rgba(60,150,190,.06);
  --bub:#1d1d25; --bub-ink:#e6e6ee; --bub-meta:#7c7c8a; --bub-shadow:0 1px 1.5px rgba(0,0,0,.4);
  --own:#4a4ab0; --own-ink:#f4f4ff; --own-meta:rgba(235,235,255,.62); --own-mention:#dcdcff; --own-code:rgba(255,255,255,.14);
  --svc:rgba(255,255,255,.08); --svc-ink:#c9c9d6; --svc-warn:rgba(200,120,30,.55);
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow-lg:0 24px 64px -12px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.06);
}

/* ═════════════ 基础 ═════════════ */
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:var(--font);color:var(--ink);background:var(--bg);font-size:14px;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit}
input,textarea,select{font:inherit;color:inherit}
::selection{background:var(--accent-soft)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:10px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
.ic{width:15px;height:15px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
code{font-family:var(--mono)}

.app{display:grid;grid-template-columns:248px 1fr;grid-template-rows:minmax(0,1fr);height:100vh}
.stage{display:grid;grid-template-columns:1fr 336px;grid-template-rows:minmax(0,1fr);min-height:0;margin:8px 8px 8px 0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0;box-shadow:var(--shadow-sm)}

/* ═════════════ 左侧栏 ═════════════ */
.side{display:flex;flex-direction:column;min-width:0;min-height:0;padding:10px 8px}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px}
.logo{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(135deg,#7b7bf2 0%,#5b5bd6 55%,#3d3db0 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 2px 6px rgba(91,91,214,.35)}
.logo .ic{width:16px;height:16px;stroke-width:2}
.brand b{font-size:14px;font-weight:600;letter-spacing:.01em}
.brand small{display:block;font-size:11.5px;color:var(--muted);margin-top:1px}
.newbtn{display:flex;align-items:center;gap:8px;width:100%;padding:7px 10px;margin-bottom:14px;border:1px solid var(--line-strong);background:var(--surface);
  border-radius:var(--r);font-size:13px;color:var(--ink-2);box-shadow:var(--shadow-sm);transition:border-color .15s,color .15s}
.newbtn:hover{border-color:var(--accent-line);color:var(--accent)}
.newbtn kbd{margin-left:auto;font-family:var(--font);font-size:11px;color:var(--faint)}
.sect{font-size:11.5px;font-weight:500;color:var(--faint);padding:0 10px 6px;display:flex;align-items:center}
.glist{flex:1;overflow:auto;display:flex;flex-direction:column;gap:1px}
.gitem{padding:7px 10px;border-radius:var(--r);cursor:pointer;display:flex;gap:10px;align-items:center;transition:background .12s}
.gitem:hover{background:var(--hover)}
.gitem.on{background:var(--surface-3)}
.gav{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;font-size:13px;flex:none}
.gmeta{min-width:0;flex:1}
.gmeta b{display:block;font-weight:500;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gmeta span{font-size:12px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.glist .none{padding:10px;color:var(--muted);font-size:12.5px;line-height:1.7}
.sidefoot{border-top:1px solid var(--line);margin-top:8px;padding:10px 4px 2px;display:flex;align-items:center;gap:6px}
.conn{flex:1;min-width:0;font-size:12px;color:var(--muted);display:flex;gap:7px;align-items:center;padding:4px 6px}
.conn span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:28px;height:28px;border-radius:7px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;flex:none}
.iconbtn:hover{background:var(--hover);color:var(--ink)}

/* 状态点 */
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.dot.ok{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 18%,transparent)}
.dot.bad{background:var(--bad)}
.dot.busy{background:var(--busy);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}

/* ═════════════ 中间：聊天 ═════════════ */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;border-right:1px solid var(--line)}
.head{height:54px;padding:0 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex:none}
.head .ttl{min-width:0;flex:1}
.head h2{margin:0;font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:8px}
.head .sub{color:var(--muted);font-size:11.5px;font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px;margin-top:2px}
.head .sub .ic{width:12px;height:12px}
.count{font-size:11.5px;font-weight:500;color:var(--muted);background:var(--surface-3);border-radius:20px;padding:1px 8px}
.stack{display:flex;align-items:center;padding-left:6px}
.stack .av{margin-left:-6px;box-shadow:0 0 0 2px var(--surface)}
.ghostbtn{border:1px solid transparent;background:none;color:var(--muted);font-size:12.5px;padding:5px 9px;border-radius:7px;display:flex;align-items:center;gap:5px}
.ghostbtn:hover{background:var(--hover);color:var(--ink)}
.ghostbtn.danger:hover{color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,transparent)}

.msgs{flex:1;overflow:auto;padding:6px 0 10px;background-color:var(--wall);background-image:radial-gradient(circle at 1px 1px,var(--wall-dot) 1px,transparent 1.6px),radial-gradient(1200px 500px at 85% -10%,var(--wall-glow),transparent 60%),radial-gradient(900px 500px at -10% 110%,var(--wall-glow2),transparent 60%);background-size:22px 22px,100% 100%,100% 100%;background-attachment:local,scroll,scroll}
.empty{height:100%;display:grid;place-items:center;text-align:center;padding:24px}
.empty .art{width:52px;height:52px;border-radius:14px;margin:0 auto 14px;display:grid;place-items:center;color:var(--accent);background:var(--accent-soft);border:1px solid var(--accent-line)}
.empty .art .ic{width:24px;height:24px}
.empty h3{margin:0 0 6px;font-size:15px;font-weight:600}
.empty p{margin:0;color:var(--muted);font-size:13px;line-height:1.7}
.empty .btn{margin-top:16px}

/* 消息：Telegram 式气泡。群主靠右，成员靠左；连续发言合并，头像只出现在最后一条旁边 */
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;flex:none;font-size:12.5px;position:relative}
.av.sm{width:26px;height:26px;font-size:9.5px;letter-spacing:-.02em}
.av.md{width:30px;height:30px;font-size:11.5px}
.av.me{background:var(--ink);color:var(--surface)}
.av .sd{position:absolute;right:-2px;bottom:-2px;width:11px;height:11px;border-radius:50%;border:2.5px solid var(--surface);background:var(--faint)}
.av .sd.ok{background:var(--ok)}.av .sd.busy{background:var(--busy)}.av .sd.bad{background:var(--bad)}

.msg{display:flex;align-items:flex-end;gap:10px;padding:1px 20px;max-width:100%}
.msg.first{margin-top:10px}
.msg .avslot{width:34px;flex:none}
.msg.owner{justify-content:flex-end}
.bub{position:relative;max-width:min(640px,72%);min-width:84px;background:var(--bub);color:var(--bub-ink);
  padding:7px 11px 7px 12px;border-radius:16px;box-shadow:var(--bub-shadow)}
.msg.owner .bub{background:var(--own);color:var(--own-ink)}
/* 气泡分组：同组内靠头像一侧的圆角收紧 */
.msg:not(.owner):not(.first) .bub{border-top-left-radius:6px}
.msg:not(.owner):not(.last) .bub{border-bottom-left-radius:6px}
.msg.owner:not(.first) .bub{border-top-right-radius:6px}
.msg.owner:not(.last) .bub{border-bottom-right-radius:6px}
/* 小尾巴：只画在一组的最后一条 */
.msg.last .bub::after{content:"";position:absolute;bottom:0;width:12px;height:18px;background:inherit}
.msg.last:not(.owner) .bub{border-bottom-left-radius:2px}
.msg.last:not(.owner) .bub::after{left:-10px;clip-path:path("M12 0 L12 18 L0 18 C4 17 8 14 10 6 L12 0 Z")}
.msg.last.owner .bub{border-bottom-right-radius:2px}
.msg.last.owner .bub::after{right:-10px;clip-path:path("M0 0 L0 18 L12 18 C8 17 4 14 2 6 L0 0 Z")}
.bname{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin-bottom:2px;line-height:1.45}
.bname b{font-weight:600;font-size:13px}
.bname .pill{font-size:10.5px}
.pill{font-size:11px;padding:0 7px;border-radius:20px;background:var(--surface-3);color:var(--muted);font-weight:500;line-height:1.7}
.bto{font-size:11.5px;color:var(--own-meta);margin-bottom:2px}
.text{line-height:1.6;word-wrap:break-word;overflow-wrap:anywhere}
/* 时间嵌在气泡右下角：正文末尾留一段空白，时间绝对定位过去 */
.tspace{display:inline-block;width:42px;height:1px}
.btime{position:absolute;right:10px;bottom:5px;font-size:11px;color:var(--bub-meta);line-height:1;pointer-events:none}
.msg.owner .btime{color:var(--own-meta)}
.text pre{background:var(--pre-bg);color:var(--pre-ink);padding:10px 12px;border-radius:10px;overflow:auto;font-family:var(--mono);font-size:12.5px;line-height:1.55;margin:6px 0}
.text code{font-family:var(--mono);font-size:12.5px;background:var(--code-bg);padding:0 5px;border-radius:5px}
.msg.owner .text code{background:var(--own-code)}
.text pre code{background:none !important;padding:0}
.mention{color:var(--accent);font-weight:500}
.msg.owner .mention{color:var(--own-mention);font-weight:600}
.text.long{max-height:320px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 65%,transparent);mask-image:linear-gradient(#000 65%,transparent)}
.more{display:block;font-size:12px;color:var(--accent);background:none;border:0;padding:4px 0 2px;font-weight:500}
.msg.owner .more{color:var(--own-mention)}
.more:hover{text-decoration:underline}
/* 系统消息与日期：居中的半透明小胶囊 */
.sys{display:flex;justify-content:center;padding:3px 18px}
.sys.first{margin-top:10px}
.svc{background:var(--svc);color:var(--svc-ink);font-size:12px;line-height:1.5;padding:3px 11px;border-radius:12px;max-width:min(560px,86%);white-space:pre-wrap;overflow-wrap:anywhere;text-align:center;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.svc time{opacity:.7;margin-left:6px;font-size:11px}
.sys.warn .svc{background:var(--svc-warn);color:#fff;text-align:left}
.daysep{position:sticky;top:6px;z-index:2;display:flex;justify-content:center;padding:8px 0 4px;pointer-events:none}
.daysep span{background:var(--svc);color:var(--svc-ink);font-size:12px;font-weight:500;padding:2px 11px;border-radius:12px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.typing{font-size:12px;color:var(--muted);padding:0 22px;height:24px;display:flex;align-items:center;gap:8px;flex:none}
.dots{display:inline-flex;gap:3px}
.dots i{width:4px;height:4px;border-radius:50%;background:var(--accent);animation:bounce 1.2s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-3px);opacity:1}}

.composer{padding:0 18px 16px;flex:none}
.cbox{border:1px solid var(--line-strong);border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--shadow-sm);transition:border-color .15s,box-shadow .15s}
.cbox:focus-within{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.input{display:block;width:100%;resize:none;border:0;background:transparent;padding:12px 14px 4px;min-height:46px;max-height:180px;outline:none;line-height:1.6}
textarea.input::placeholder{color:var(--faint)}
.ctool{display:flex;align-items:center;gap:8px;padding:6px 8px 8px 10px}
.chips{display:flex;gap:4px;flex-wrap:wrap;flex:1;min-width:0}
.chip{border:0;background:var(--surface-3);border-radius:20px;padding:2px 9px;font-size:12px;color:var(--muted);transition:background .12s,color .12s}
.chip:hover{background:var(--accent-soft);color:var(--accent)}
.send{display:flex;align-items:center;gap:6px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:6px 12px;font-size:13px;font-weight:500;flex:none;transition:background .15s}
.send:hover{background:var(--accent-2)}
.send:disabled{opacity:.4;cursor:default}
.send .ic{width:14px;height:14px}
.hint{font-size:11.5px;color:var(--faint);margin:7px 4px 0;display:flex;gap:12px;flex-wrap:wrap}
.hint kbd{font-family:var(--font);font-size:10.5px;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--muted)}

/* ═════════════ 右侧：成员 / 日志 ═════════════ */
.right{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--surface-2)}
.tabs{display:flex;align-items:center;height:54px;padding:0 12px;border-bottom:1px solid var(--line);flex:none}
.seg{display:flex;background:var(--surface-3);border-radius:8px;padding:2px;gap:2px;width:100%}
.seg button{flex:1;border:0;background:none;color:var(--muted);border-radius:6px;padding:5px 0;font-size:12.5px;font-weight:500}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
.pane{flex:1;overflow:auto;padding:12px}
.plabel{font-size:11.5px;font-weight:500;color:var(--faint);padding:4px 4px 8px;display:flex;align-items:center}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px;margin-bottom:8px;transition:border-color .15s}
.mcard:hover{border-color:var(--line-strong)}
.mtop{display:flex;gap:10px;align-items:center}
.mtop .nm{font-weight:600;font-size:13.5px}
.mtop .pv{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mstat{margin-left:auto;font-size:11.5px;color:var(--muted);white-space:nowrap}
.mstat.busy{color:var(--busy)}.mstat.bad{color:var(--bad)}
.duty{font-size:12.5px;color:var(--ink-2);margin:10px 0 8px;line-height:1.55}
.duty b{font-weight:500;color:var(--ink)}
.tools{display:flex;flex-wrap:wrap;gap:4px}
.tool{font-family:var(--mono);font-size:10.5px;padding:1px 6px;border-radius:5px;background:var(--tool);color:var(--tool-ink)}
.tool.w{background:var(--tool-w);color:var(--tool-w-ink)}
.mact{display:flex;gap:2px;margin:10px -4px -4px;border-top:1px solid var(--line);padding-top:6px}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 9px;font-size:12px;color:var(--ink-2)}
.mini:hover{border-color:var(--line-strong);color:var(--ink)}
.mini.del:hover{border-color:var(--bad);color:var(--bad)}
.mact .mini{border-color:transparent;background:none;color:var(--muted)}
.mact .mini:hover{background:var(--hover);color:var(--ink)}
.mact .mini.del{margin-left:auto}
.mact .mini.del:hover{color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,transparent)}
.mcard.me{background:transparent;border-style:dashed}
/* 用量 / 额度 */
.usage{margin-top:10px;padding-top:9px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:7px}
.qrow{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;font-size:11.5px;color:var(--muted)}
.qbar{height:5px;border-radius:5px;background:var(--surface-3);overflow:hidden}
.qbar i{display:block;height:100%;border-radius:5px;background:var(--accent);transition:width .4s}
.qbar i.mid{background:var(--busy)}.qbar i.hi{background:var(--bad)}
.qrow b{font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums}
.qsub{font-size:11px;color:var(--faint);margin-top:-3px}
.cost{display:flex;align-items:baseline;gap:6px;font-size:11.5px;color:var(--muted)}
.cost b{font-size:15px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.cost .est{font-size:10.5px;color:var(--faint);border:1px solid var(--line-strong);border-radius:4px;padding:0 4px}
.tok{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.unote{font-size:11px;color:var(--faint);line-height:1.5}
.spend{font-size:11.5px;font-weight:500;color:var(--ink-2);background:var(--surface-3);border-radius:20px;padding:2px 9px;font-variant-numeric:tabular-nums;white-space:nowrap}
.spend small{color:var(--muted);font-weight:400}
.addm{width:100%;padding:10px;border:1px dashed var(--line-strong);background:transparent;border-radius:var(--r-lg);color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px}
.addm:hover{border-color:var(--accent-line);color:var(--accent);background:var(--accent-soft)}
.logbox{font-family:var(--mono);font-size:11.5px;line-height:1.7;white-space:pre-wrap;word-break:break-word;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.logpath{font-size:11px;color:var(--muted);font-family:var(--mono);margin:0 2px 8px;word-break:break-all;display:flex;gap:5px}
.logpath .ic{width:12px;height:12px;margin-top:1px}
.ghost{color:var(--muted);text-align:center;padding:40px 10px;line-height:1.7;font-size:13px}

/* ═════════════ 弹窗 ═════════════ */
.mask{position:fixed;inset:0;background:rgba(8,8,14,.42);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:9;padding:16px}
.mask.on{display:flex;animation:fade .15s ease-out}
.mask.on .modal{animation:rise .18s ease-out}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(8px) scale(.985)}}
.modal{background:var(--surface);border-radius:var(--r-lg);width:min(760px,100%);max-height:90vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
.modal header{padding:16px 20px 12px;font-weight:600;font-size:15px;display:flex;align-items:center}
.modal header .x{margin-left:auto;border:0;background:none;font-size:18px;color:var(--muted);width:28px;height:28px;border-radius:7px;line-height:1}
.modal header .x:hover{background:var(--hover);color:var(--ink)}
.modal .body{padding:4px 20px 16px;overflow:auto}
.modal footer{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;background:var(--surface-2);border-radius:0 0 var(--r-lg) var(--r-lg)}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:7px 15px;font-size:13px;font-weight:500;color:var(--ink-2);box-shadow:var(--shadow-sm)}
.btn:hover{border-color:var(--faint);color:var(--ink)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn:disabled{opacity:.6;cursor:default}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea,.fsnew input{width:100%;border:1px solid var(--line-strong);border-radius:8px;padding:7px 10px;outline:none;background:var(--surface);transition:border-color .15s,box-shadow .15s}
.field input:focus,.field select:focus,.field textarea:focus,.fsnew input:focus{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft)}
.field textarea{resize:vertical;line-height:1.55}
.pickrow{display:flex;gap:6px}.pickrow input{flex:1;min-width:0}.pickrow .btn{padding:6px 12px;white-space:nowrap}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-size:12px;cursor:pointer;margin-top:5px}
.linkbtn:hover{text-decoration:underline}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:10px}
.medit{border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;margin-bottom:10px;background:var(--surface-2)}
.medit .hd{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-weight:600}
.sechead{display:flex;align-items:baseline;gap:8px;margin:6px 0 10px}
.sechead b{font-size:13.5px}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:6px 10px}
.checks label{font-size:12.5px;display:flex;gap:6px;align-items:center;color:var(--ink);margin:0;white-space:nowrap;min-width:0;font-weight:400}
.checks label input{width:auto;margin:0;flex:none;accent-color:var(--accent)}
.checks label small{color:var(--faint);font-family:var(--mono);font-size:10.5px;overflow:hidden;text-overflow:ellipsis}
.addrow{width:100%;padding:9px;border:1px dashed var(--line-strong);background:transparent;border-radius:var(--r-lg);color:var(--muted);font-size:13px;margin-bottom:8px}
.addrow:hover{border-color:var(--accent-line);color:var(--accent);background:var(--accent-soft)}
.note{font-size:12px;color:var(--muted);line-height:1.6}
.warn{color:var(--warn)}
.banner{background:var(--warn-soft);color:var(--warn);border-bottom:1px solid var(--warn-line);padding:8px 18px;font-size:12.5px;line-height:1.6}
.banner code{background:var(--code-bg);border-radius:4px;padding:0 4px}
/* 页面内文件夹浏览器 */
.fsmask{z-index:20}
.fsbox{width:min(520px,100%)}
.fsbar{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.fspath{flex:1;min-width:0;font-family:var(--mono);font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fslist{border:1px solid var(--line);border-radius:var(--r);height:300px;overflow:auto;background:var(--surface)}
.fslist button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:8px 12px;font-size:13px}
.fslist button:hover{background:var(--accent-soft);color:var(--accent)}
.fslist button .ic{color:var(--muted)}
.fslist .empty{padding:20px;text-align:center;color:var(--muted);font-size:12.5px;height:auto}
.fsnew{display:flex;gap:6px;margin-top:8px}.fsnew input{flex:1;min-width:0}

@media (max-width:1100px){.stage{grid-template-columns:1fr}.right{display:none}}
@media (max-width:760px){.app{grid-template-columns:1fr}.side{display:none}.stage{margin:0;border-radius:0;border:0}.grid2{grid-template-columns:1fr}}

<script>
/* ═════════════ 常量 ═════════════ */
const TOOLS = [
  ["fs_read","读文件"],["fs_list","列目录/搜索"],["fs_write","写文件",1],["execute_bash","执行命令",1],
  ["web_fetch","联网"],["@builtin","内置能力"],["@cao-mcp-server","调度其他agent"],["discovery","发现同伴"]
];
const WRITE_TOOLS = new Set(["fs_write","execute_bash","fs_*","*"]);
let ROLES = {
  supervisor:["@cao-mcp-server","fs_read","fs_list"],
  developer:["@builtin","fs_*","execute_bash","web_fetch","@cao-mcp-server"],
  reviewer:["@builtin","fs_read","fs_list","@cao-mcp-server"]
};
const ROLE_LABEL = {supervisor:"统筹 supervisor",developer:"开发 developer",reviewer:"评审 reviewer",custom:"自定义权限"};
let PROVIDERS = [
  {id:"claude_code",label:"Claude Code"},{id:"codex",label:"Codex CLI"},{id:"kiro_cli",label:"Kiro CLI"},
  {id:"antigravity_cli",label:"Antigravity CLI (Gemini)"},{id:"copilot_cli",label:"GitHub Copilot CLI"},
  {id:"kimi_cli",label:"Kimi CLI"},{id:"opencode_cli",label:"OpenCode CLI"},{id:"cursor_cli",label:"Cursor CLI"},{id:"hermes",label:"Hermes"}
];
// 订阅计划 → 模型（后端会下发真实列表；这里是演示模式的兜底）
let MODELS = {claude_code:[
  {id:"pro",label:"Claude Pro",models:[{id:"sonnet",label:"Sonnet（推荐）"},{id:"haiku",label:"Haiku（快、省额度）"},{id:"opus",label:"Opus（额度消耗快，Pro 可能受限）"}]},
  {id:"max",label:"Claude Max",models:[{id:"opus",label:"Opus（推荐）"},{id:"opusplan",label:"Opus 规划 + Sonnet 执行"},{id:"sonnet",label:"Sonnet"},{id:"haiku",label:"Haiku"}]},
  {id:"team",label:"Team / Enterprise",models:[{id:"opus",label:"Opus"},{id:"sonnet",label:"Sonnet（推荐）"},{id:"haiku",label:"Haiku"}]},
  {id:"api",label:"API Key（按量计费）",models:[{id:"claude-opus-5-5",label:"Claude Opus 5.5"},{id:"claude-sonnet-5-5",label:"Claude Sonnet 5.5"},{id:"claude-haiku-5-5",label:"Claude Haiku 5.5"},{id:"claude-fable-5-2",label:"Claude Fable 5.2"}]}
]};
const EFFORTS = {codex:["low","medium","high","xhigh"],claude_code:["low","medium","high","xhigh","max"]};
function cleanEffort(provider,value){
  if(value==null) return "";
  if(typeof value!=="string") throw new Error("推理强度必须是字符串");
  const effort=value.trim();
  if(effort && !(EFFORTS[provider]||[]).includes(effort)) throw new Error("该模型 CLI 不支持所选推理强度");
  return effort;
}
function effortRowHTML(provider,value){
  const choices=EFFORTS[provider]; if(!choices) return "";
  const current=choices.includes(value)?value:"";
  return `<div class="field"><label>推理强度</label><select name="effort">${["",...choices].map(v=>`<option value="${v}" ${v===current?"selected":""}>${v||"默认（CLI 自己的默认强度）"}</option>`).join("")}</select></div>`;
}
function effortCaption(m){ return EFFORTS[m.provider]?`推理强度：${m.effort||"CLI 默认"}`:""; }
const CUSTOM="__custom";
function lsGet(k){ try{ return localStorage.getItem(k)||""; }catch{ return ""; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch{} }
function provInfo(id){ return PROVIDERS.find(p=>p.id===id)||{id,label:id}; }
const SOFT = new Set(["codex","kimi_cli","antigravity_cli","minimax_code"]);   // 权限软约束
const NONE = new Set(["cursor_cli"]);                                          // 不执行权限
const COLORS = ["#e0703f","#4b74e8","#169e6c","#8b5cf0","#d9487a","#c8920c","#1497ad","#6b7a8f"];
const ico=(n,cls)=>`<svg class="ic ${cls||""}"><use href="#i-${n}"/></svg>`;
const STATUS_TXT = {new:"未启动",starting:"启动中",idle:"空闲",completed:"空闲",processing:"思考中",running:"思考中",
  waiting_ready:"等待就绪",delivery_uncertain:"可能未送达",not_ready:"尚未投递",delivery_failed:"投递失败",
  waiting_user_answer:"等你确认",error:"出错",failed:"启动失败",stopped:"已停止",gone:"终端已关闭"};

/* ═════════════ 演示模式（没有后端时在浏览器里模拟） ═════════════ */
class Mock {
  constructor(){ this.groups = {}; this.logs = {}; }
  now(){ const d=new Date(),p=n=>String(n).padStart(2,"0"); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; }
  log(g,who,what){ this.logs[g.id] = (this.logs[g.id]||`# 项目群「${g.name}」共享行为日志\n\n`) + `- [${this.now()}] [${who}] ${what}\n`; }
  msg(g,kind,sender,text,mid,to){ const m={seq:g.messages.length+1,ts:this.now(),kind,sender,text,member_id:mid||null,to:to||[]};
    g.messages.push(m); if(kind!=="system") this.log(g,sender,`发言${to&&to.length?`（→ ${to.join(", ")}）`:""}：${text.split("\n")[0].slice(0,120)}`); return m; }
  member(raw,g){ const name=(raw.name||"").trim(); if(!name) throw new Error("成员需要名字");
    if(g.members.some(x=>x.name===name&&x.id!==raw.id)) throw new Error(`群里已经有叫 ${name} 的成员`);
    const provider=raw.provider||"claude_code", effort=cleanEffort(provider,raw.effort);
    return {id:raw.id||("m"+Math.random().toString(16).slice(2,8)),name,provider,effort,model:raw.model||"",plan:raw.plan||"",
      role:raw.role||"developer",tools:raw.tools||[],duty:raw.duty||"",permission_mode:raw.permission_mode||"",color:raw.color||"",
      terminal_id:null,status:"starting"}; }
  boot(g,m){ setTimeout(()=>{ m.terminal_id=Math.random().toString(16).slice(2,10); m.status="idle";
    this.msg(g,"system","系统",`${m.name} 已入群，终端 ${m.terminal_id}。（演示）`);
    this.log(g,"群主",`邀请 ${m.name} 入群：provider=${m.provider}，角色=${m.role}，权限=${eff(m).join(",")}，职责=${m.duty||"未指定"}`); }, 600+Math.random()*700); }
  mentions(g,text,ex){ return g.members.filter(x=>x.id!==ex && text.includes("@"+x.name)); }
  deliver(g,m,text,hops){ m.status="processing";
    setTimeout(()=>{ m.status="idle"; const reply=this.fake(g,m,text,hops); this.msg(g,"agent",m.name,reply,m.id);
      (reply.match(/^\s*\[日志\]\s*(.+)$/gm)||[]).forEach(l=>this.log(g,m.name,l.replace(/^\s*\[日志\]\s*/,"")));
      const t=this.mentions(g,reply,m.id); if(t.length&&hops<6) t.forEach(x=>this.deliver(g,x,`[来自 ${m.name}] ${reply}`,hops+1));
    }, 1400+Math.random()*1800); }
  fake(g,m,text,hops){
    const others=g.members.filter(x=>x.id!==m.id), rev=others.find(x=>x.role==="reviewer"), dev=others.find(x=>x.role==="developer");
    const w=eff(m).some(t=>WRITE_TOOLS.has(t));
    const fromPeer=text.startsWith("[来自");
    if(m.role==="supervisor"){
      if(fromPeer) return `收到。${hops>=2?"这一轮先到这里，@群主 请确认是否合并。":"继续推进。"}\n\n[日志] 汇总进度，等待群主决定`;
      return `明白，我来拆一下任务：\n1. 需求梳理与接口设计（我）\n2. 实现${dev?` → ${dev.name}`:""}\n3. 代码评审${rev?` → ${rev.name}`:""}\n\n${dev?`@${dev.name} 请先按上面第 2 点开工，完成后告诉 ${rev?rev.name:"我"}。`:""}\n\n[日志] 拆分任务并分派`; }
    if(m.role==="reviewer"){
      return `评审意见（只读审查，未修改文件）：\n- ✅ 结构清晰，命名一致\n- ⚠️ \`handleLogin\` 缺少输入长度校验\n- ⚠️ 错误信息直接返回给前端，建议统一错误码\n\n${hops<4&&dev?`@${dev.name} 麻烦补上第 2、3 点。`:"@群主 剩余问题不阻塞，可以合并。"}\n\n[日志] 完成第 ${hops} 轮评审，提出 2 条意见`; }
    if(fromPeer && rev && text.startsWith(`[来自 ${rev.name}]`))
      return `已修复评审意见：\n\`\`\`diff\n+ if (pwd.length > 128) throw new BadRequest("E_PWD_LEN")\n- res.send(err.message)\n+ res.status(400).json({code: err.code})\n\`\`\`\n${rev?`@${rev.name} 请复查。`:""}${w?"":"\n\n[日志] 按评审意见修改 auth.ts"}`;
    return `好的，开始实现。\n\n- 新建 \`src/auth.ts\`，实现登录接口\n- 补充单元测试 \`auth.test.ts\`（12 项全部通过）\n\n${rev?`@${rev.name} 可以评审了。`:""}${w?"":"\n\n[日志] 实现登录接口"}`; }
  async call(method,path,body){
    await new Promise(r=>setTimeout(r,80));
    const p=path.split("?")[0].split("/").filter(Boolean).slice(1), q=new URLSearchParams(path.split("?")[1]||"");
    if(p[0]==="health") return {ok:true,cao:false,mock:true,providers:PROVIDERS,roles:ROLES,models:MODELS};
    if(p[0]==="groups"&&p.length===1){
      if(method==="GET") return Object.values(this.groups).map(g=>({id:g.id,name:g.name,members:g.members.length,last:g.messages.at(-1)||null}));
      const id=Math.random().toString(16).slice(2,10); if(!body.name||!body.workdir) throw new Error("群名和工作目录必填");
      const g={id,name:body.name,workdir:body.workdir,members:[],messages:[],session_name:"grp-"+id.slice(0,4)};
      (body.members||[]).forEach(r=>g.members.push(this.member(r,g))); this.groups[id]=g; this.log(g,"群主",`创建项目群「${g.name}」，工作目录 ${g.workdir}`);
      g.members.forEach(m=>this.boot(g,m)); return this.pub(g,0); }
    const g=this.groups[p[1]]; if(!g) throw new Error("群不存在");
    const r=p.slice(2);
    if(!r.length&&method==="GET") return this.pub(g,+q.get("since")||0);
    if(!r.length&&method==="DELETE"){ delete this.groups[g.id]; return {ok:true}; }
    if(r[0]==="usage") return {members:{},api_cost:0,api_cost_complete:true,prices_file:"~/.cao-groupchat/prices.json"};
    if(r[0]==="log") return {path:g.workdir.replace(/\/$/,"")+"/GROUP_LOG.md",content:this.logs[g.id]||""};
    if(r[0]==="messages"){ const text=body.text.trim(); let t=this.mentions(g,text);
      if(!t.length||/@(所有人|all)/i.test(text)) t=g.members.filter(x=>x.terminal_id);
      const m=this.msg(g,"owner","群主",text,null,t.map(x=>x.name)); t.forEach(x=>this.deliver(g,x,"[群主] "+text,0)); return m; }
    if(r[0]==="members"&&r.length===1){ const m=this.member(body,g); g.members.push(m); this.boot(g,m); return m; }
    const m=g.members.find(x=>x.id===r[1]); if(!m) throw new Error("成员不存在");
    if(method==="DELETE"){ g.members.splice(g.members.indexOf(m),1); this.log(g,"群主",`将 ${m.name} 移出群`); this.msg(g,"system","系统",`${m.name} 已被移出群。`); return {ok:true}; }
    if(method==="PUT"){ const n=this.member({...body,id:m.id},g); g.members[g.members.indexOf(m)]=n;
      this.log(g,"群主",`调整 ${n.name} 的配置并重启：角色=${n.role}，权限=${eff(n).join(",")}，推理强度=${n.effort||"CLI 默认"}`); this.boot(g,n); return n; }
    if(r[2]==="restart"){ m.status="starting"; this.boot(g,m); return {ok:true}; }
  }
  pub(g,since){ return {...g,log_file:g.workdir+"/GROUP_LOG.md",members:g.members.map(m=>({...m,effective_tools:eff(m)})),messages:g.messages.filter(m=>m.seq>since)}; }
}
function eff(m){ return (m.tools&&m.tools.length)?m.tools:(ROLES[m.role]||ROLES.developer); }

/* ═════════════ API ═════════════ */
let mock=null;
function ask(t){ if(mock) return true; try{ return confirm(t); }catch{ return true; } }
async function api(method,path,body){
  if(mock) return mock.call(method,"/api"+path,body);
  const r=await fetch("/api"+path,{method,headers:{"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error||("HTTP "+r.status));
  return j;
}

function provLabel(id){ return (PROVIDERS.find(p=>p.id===id)||{label:id}).label; }

function md(text,members){
  let s=esc(text);
  const blocks=[];
  s=s.replace(/```(\w*)\n?([\s\S]*?)```/g,(_,l,c)=>{blocks.push(`<pre><code>${c.replace(/\n$/,"")}</code></pre>`);return `\u0000${blocks.length-1}\u0000`;});
  s=s.replace(/`([^`\n]+)`/g,"<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g,"<b>$1</b>");
  const names=(members||[]).map(m=>m.name).concat(["群主","所有人"]).sort((a,b)=>b.length-a.length);
  if(names.length){ const re=new RegExp("@("+names.map(n=>esc(n).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")","g"); s=s.replace(re,'<span class="mention">@$1</span>'); }
  s=s.replace(/\n/g,"<br>").replace(/\u0000(\d+)\u0000/g,(_,i)=>blocks[i]);
  return s;
}

const fmtUSD=v=>v==null?"—":v<0.01&&v>0?"<$0.01":"$"+v.toFixed(v<1?3:2);
const fmtTok=n=>n>=1e6?(n/1e6).toFixed(n>=1e7?0:1)+"M":n>=1e3?(n/1e3).toFixed(n>=1e4?0:1)+"k":String(n||0);
function fmtDur(sec){ if(sec==null) return ""; const h=sec/3600; if(h<1) return Math.max(1,Math.round(sec/60))+" 分钟";
  if(h<48) return Math.round(h)+" 小时"; return Math.round(h/24)+" 天"; }
function winLabel(min){ if(min===300) return "5 小时"; if(min===10080) return "每周"; if(min%1440===0) return (min/1440)+" 天"; return Math.round(min/60)+" 小时"; }
function tokLine(u){ const t=u.tokens; return `输入 ${fmtTok(t.in)} · 缓存读 ${fmtTok(t.cache_read)}${t.cache_write?` · 缓存写 ${fmtTok(t.cache_write)}`:""} · 输出 ${fmtTok(t.out)}`; }
function usageHTML(m){
  const x=S.usage&&S.usage.members&&S.usage.members[m.id]; if(!x) return "";

      rows.push(`<div class="qrow"><span>${winLabel(w.window_minutes)}额度</span><div class="qbar"><i class="${cls}" style="width:${p}%"></i></div><b>${w.stale?"已重置":p+"%"}</b></div>`+
        (w.stale||w.resets_in==null?"":`<div class="qsub">${fmtDur(w.resets_in)}后重置</div>`));
    });
    if(x.limits.credits&&x.limits.credits.has) rows.push(`<div class="unote">额外 credits 余额：${esc(x.limits.credits.balance)}</div>`);
  }else if(x.mode==="subscription"&&!x.limits_available){
    rows.push(`<div class="unote">订阅剩余额度：该 CLI 不在日志里记录，可在它的终端里用 <code>/usage</code> 查看</div>`);

    }
  }else if(m.terminal_id){
    rows.push(`<div class="unote">还没有用量记录${["claude_code","codex"].includes(m.provider)?"":"（目前只支持读取 Claude Code 和 Codex 的日志）"}</div>`);

const retrying=new Set();
async function retryDelivery(id){

  if(!ask(m.delivery_state==="uncertain"?"消息也可能已送达且仍在执行。请先核对终端，重发可能重复操作。确认重发原消息？":"终端就绪后将重试投递原消息，确认继续？")) return;
  retrying.add(id);
  try{ await api("POST",`/groups/${g.id}/members/${id}/retry`,{delivery_id:m.delivery_id,delivery_attempt:m.delivery_attempt}); await refresh(); }
  catch(e){ alert(e.message); } finally{ retrying.delete(id); }
}
async function loadLog(){
  if(!S.group||S.tab!=="log") return;
  try{ const r=await api("GET",`/groups/${S.group.id}/log`); const pane=$("#pane");
    const atBottom=pane.scrollHeight-pane.scrollTop-pane.clientHeight<60;
    pane.innerHTML=`<div class="logpath">${ico("file")}<span>${esc(r.path)}</span></div><div class="logbox">${r.content?esc(r.content):'<span style="color:var(--muted)">还没有记录</span>'}</div>`;
    if(atBottom) pane.scrollTop=pane.scrollHeight; }catch(e){ $("#pane").innerHTML=`<div class="ghost">读取日志失败：${esc(e.message)}</div>`; }
}
function renderAll(scroll){ renderGroups(); renderHead(); renderMsgs(scroll); renderComposer(); renderPane(); }

/* ═════════════ 数据 ═════════════ */
async function loadGroups(){ S.groups=await api("GET","/groups"); }
async function openGroup(id){ S.cur=id; S.msgs=[]; S.usage=null; S.usageSig=""; const g=await api("GET",`/groups/${id}`); if(S.cur!==id) return; S.group=g; S.msgs=g.messages; renderAll(true); loadUsage(); }
let lastSig="", refreshing=false;
async function refresh(){
  if(!S.cur||refreshing) return;
  refreshing=true;
  try{
    const since=S.msgs.length?S.msgs.at(-1).seq:0;
    const g=await api("GET",`/groups/${S.cur}?since=${since}`);
    if(g.id!==S.cur) return;
    const top=S.msgs.length?S.msgs.at(-1).seq:0;
    const fresh=g.messages.filter(m=>m.seq>top);
    S.group=g; S.msgs=S.msgs.concat(fresh);
    const sig=JSON.stringify(g.members.map(m=>[m.id,m.status,m.pending,m.role,m.tools,m.duty,m.name,m.provider,m.model,m.effort,m.delivery_state,m.can_retry,m.delivery_id,m.delivery_attempt,m.queued_count]));
    if(fresh.length){ renderMsgs(); await loadGroups(); renderGroups(); if(S.tab==="log") loadLog();
      if(fresh.some(m=>m.kind==="agent")) setTimeout(loadUsage,1500); }
    if(sig!==lastSig){ lastSig=sig; renderHead(); renderComposer(); if(S.tab==="members") renderPane(); }
    else renderComposer();
  }catch(e){}
  finally{ refreshing=false; }
}

/* ═════════════ 弹窗 ═════════════ */
function closeModal(){ $("#mask").classList.remove("on"); }

    <div class="grid2">
      <div class="field"><label>角色（决定默认权限）</label><select name="role">${Object.keys(ROLE_LABEL).map(r=>`<option value="${r}" ${r===role?"selected":""}>${ROLE_LABEL[r]}</option>`).join("")}</select></div>
      <div class="field cc" style="${(m.provider||"claude_code")==="claude_code"?"":"display:none"}"><label>Claude Code 权限模式</label>
        <select name="permission_mode">${[["","默认（每次询问）"],["acceptEdits","自动接受文件修改"],["plan","只规划不执行"]].map(([v,l])=>`<option value="${v}" ${v===(m.permission_mode||"")?"selected":""}>${l}</option>`).join("")}</select></div>
    </div>
    <div class="field"><label>权限（CAO 工具）</label><div class="checks">${TOOLS.map(([t,l,w])=>{
      const on=tools.includes(t)||(t.startsWith("fs_")&&tools.includes("fs_*"))||tools.includes("*");
      return `<label><input type="checkbox" value="${t}" ${on?"checked":""}><span ${w?'class="warn"':""}>${l}</span> <small>${t}</small></label>`;}).join("")}</div></div>

}
function installNote(prov){
  const p=provInfo(prov);
  return p.installed===false?`<p class="note warn" style="margin:-4px 0 8px">⚠ 本机没有找到 <code>${esc(p.binary||prov)}</code> 命令，启动会失败。请先安装并登录该 CLI。</p>`:"";
}
function modelRowHTML(prov,plan,model){
  const plans=MODELS[prov]||[]; model=model||"";
  if(!plans.length) return `${installNote(prov)}<div class="field"><label>具体模型（可选）</label><input name="model" value="${esc(model)}" placeholder="留空用 CLI 默认模型"><input type="hidden" name="plan" value=""></div>`;
  let pl=plans.find(x=>x.id===plan)||plans.find(x=>x.id===lsGet("plan:"+prov))||plans[0];
  // 已有模型不在当前计划里时，换到包含它的计划
  if(model && !pl.models.some(x=>x.id===model)){ const hit=plans.find(x=>x.models.some(y=>y.id===model)); if(hit) pl=hit; }
  const known=!model||pl.models.some(x=>x.id===model);
  const opts=[`<option value="">默认（CLI 自己的默认模型）</option>`]
    .concat(pl.models.map(x=>`<option value="${esc(x.id)}" ${x.id===model?"selected":""} title="${esc(x.note||"")}">${esc(x.label)}${x.label===x.id?"":" · "+esc(x.id)}</option>`))
    .concat([`<option value="${CUSTOM}" ${known?"":"selected"}>自定义…</option>`]);
  return `${installNote(prov)}<div class="grid2">
    <div class="field"><label>订阅计划</label><select name="plan">${plans.map(x=>`<option value="${x.id}" ${x.id===pl.id?"selected":""}>${esc(x.label)}</option>`).join("")}</select></div>
    <div class="field"><label>模型</label><select name="model_sel">${opts.join("")}</select>
      <input name="model" value="${known?"":esc(model)}" placeholder="输入模型 ID" style="margin-top:6px;${known?"display:none":""}"></div>
  </div><p class="note" style="margin:-4px 0 8px">按计划给出的是推荐选项，实际可用模型以你的账号为准。</p>`;
}
function readModel(el){
  const sel=el.querySelector("[name=model_sel]"), inp=el.querySelector("[name=model]");
  if(sel && sel.value!==CUSTOM) return sel.value;
  return inp?inp.value.trim():"";
}
function wireModelRow(el){
  const prov=el.querySelector("[name=provider]"), box=el.querySelector(".mdl");
  const plan=box.querySelector("select[name=plan]"), sel=box.querySelector("[name=model_sel]"), inp=box.querySelector("[name=model]");
  if(plan) plan.onchange=()=>{ lsSet("plan:"+prov.value,plan.value); box.innerHTML=modelRowHTML(prov.value,plan.value,""); wireModelRow(el); };
  if(sel) sel.onchange=()=>{ inp.style.display=sel.value===CUSTOM?"":"none"; if(sel.value===CUSTOM) inp.focus(); };
}
function readMember(el){
  const v=n=>el.querySelector(`[name=${n}]`).value.trim();
  const role=v("role"), checked=[...el.querySelectorAll(".checks input:checked")].map(x=>x.value);
  const preset=ROLES[role];
  const norm=a=>{ const s=new Set(a); if(s.has("fs_*")){s.delete("fs_*");["fs_read","fs_write","fs_list"].forEach(x=>s.add(x));} return [...s].sort().join(","); };
  const custom = role==="custom" || !preset || norm(checked)!==norm(preset);
  const effort=cleanEffort(v("provider"),el.querySelector("[name=effort]")?.value);
  return {name:v("name"),provider:v("provider"),effort,model:readModel(el),plan:v("plan"),duty:v("duty"),permission_mode:v("permission_mode"),
    role: role==="custom"?"developer":role, tools: custom?checked:[]};
}
function wireMemberForm(el){
  const roleSel=el.querySelector("[name=role]"), prov=el.querySelector("[name=provider]");
  roleSel.onchange=()=>{ const t=ROLES[roleSel.value]; if(!t) return;
    el.querySelectorAll(".checks input").forEach(c=>c.checked=t.includes(c.value)||(c.value.startsWith("fs_")&&t.includes("fs_*"))); };
  el.querySelectorAll(".checks input").forEach(c=>c.onchange=()=>{ const t=ROLES[roleSel.value];
    const now=[...el.querySelectorAll(".checks input:checked")].map(x=>x.value).sort().join(",");
    const exp=t?[...new Set(t.flatMap(x=>x==="fs_*"?["fs_read","fs_write","fs_list"]:[x]))].sort().join(","):"";
    if(now!==exp) roleSel.value="custom"; });
  prov.onchange=()=>{ el.querySelector(".cc").style.display=prov.value==="claude_code"?"":"none";
    const effort=el.querySelector("[name=effort]")?.value;
    el.querySelector(".effort").innerHTML=effortRowHTML(prov.value,effort);
    el.querySelector(".mdl").innerHTML=modelRowHTML(prov.value,"",""); wireModelRow(el); };
  wireModelRow(el);
  const nm=el.querySelector("[name=name]"); nm.oninput=()=>{ el.querySelector(".hd span:nth-child(2)").textContent=nm.value||"新成员"; el.querySelector(".hd .av").textContent=(nm.value||"新").slice(0,2); };
}
const TEMPLATE=[
  {name:"统筹",provider:"claude_code",role:"supervisor",duty:"拆分任务、分派给其他成员、跟进进度并向群主汇报；不直接写代码。"},
  {name:"开发",provider:"codex",role:"developer",duty:"按分派实现功能、写测试；完成后 @评审。"},
  {name:"评审",provider:"claude_code",role:"reviewer",duty:"只读审查代码，指出问题和风险；不修改文件。"}
];
function openGroupModal(){
  const draft=TEMPLATE.map(x=>({...x}));
  $("#modal").innerHTML=`<header>新建项目群<button class="x">×</button></header>
    <div class="body">
      <div class="grid2">
        <div class="field"><label>群名</label><input id="gName" placeholder="如 登录模块重构"></div>
        <div class="field"><label>工作目录（成员在这里干活，共享日志也放这里）</label>
          <div class="pickrow"><input id="gDir" placeholder="~/projects/my-app"><button class="btn" type="button" id="pickDir">选择…</button></div>
          <button class="linkbtn" type="button" id="browseDir">系统对话框没弹出来？在页面里浏览</button></div>
      </div>
      <div class="sechead"><b>邀请进群的模型</b><span class="note">已按“统筹 / 开发 / 评审”预填，可随意修改</span></div>
      <div id="mlist"></div>
      <button class="addrow" id="addRow">＋ 再加一位</button>
      <p class="note">权限由 CAO 执行：Claude Code、Kiro、Copilot、OpenCode 是<b>硬限制</b>；Codex、Kimi、Gemini 只是提示词<b>软约束</b>；Cursor 不执行限制。涉及安全的任务，把写权限交给硬限制的 CLI。</p>
    </div>
    <footer><button class="btn" data-close>取消</button><button class="btn pri" id="mk">建群并拉人</button></footer>`;
  const list=$("#mlist");
  const paint=()=>{ list.innerHTML=draft.map((m,i)=>memberFormHTML(m,i,true)).join("");
    list.querySelectorAll(".medit").forEach(el=>{ wireMemberForm(el); el.querySelector("[data-rm]").onclick=()=>{ sync(); draft.splice(+el.dataset.i,1); paint(); }; }); };
  const sync=()=>list.querySelectorAll(".medit").forEach(el=>draft[+el.dataset.i]=readMember(el));
  paint();
  $("#addRow").onclick=()=>{ sync(); draft.push({name:"",provider:"claude_code",role:"developer"}); paint(); };
  $("#mk").onclick=async()=>{ sync();
    try{ const g=await api("POST","/groups",{name:$("#gName").value.trim(),workdir:$("#gDir").value.trim(),members:draft.filter(m=>m.name)});
      closeModal(); await loadGroups(); await openGroup(g.id); }catch(e){ alert(e.message); } };
  const fill=p=>{ if(!p) return; $("#gDir").value=p;
    // 群名还空着时，用文件夹名当群名
    if(!$("#gName").value.trim()) $("#gName").value=p.replace(/\/+$/,"").split("/").pop()||""; };
  $("#pickDir").onclick=async()=>{ const b=$("#pickDir"); b.disabled=true; b.textContent="请在弹出的窗口里选择…";
    try{ fill(await pickFolder($("#gDir").value.trim())); } finally{ b.disabled=false; b.textContent="选择…"; } };
  $("#browseDir").onclick=async()=>fill(await browseFolder($("#gDir").value.trim()));
  bindClose(); $("#mask").classList.add("on"); $("#gName").focus();

/* ═════════════ 选择文件夹 ═════════════ */
// 优先弹系统原生对话框（macOS，和 Finder 一样可以新建文件夹）；不支持时退回页面内浏览
async function pickFolder(start){
  if(mock) return browseFolder(start);
  try{ const r=await api("POST","/pick-folder",{start});
    if(r.path) return r.path;
    if(r.cancelled) return null;
  }catch{}
  return browseFolder(start);
}
function browseFolder(start){
  return new Promise(resolve=>{
    const mask=document.createElement("div"); mask.className="mask fsmask on";
    mask.innerHTML=`<div class="modal fsbox"><header>选择工作目录<button class="x">×</button></header>
      <div class="body">
        <div class="fsbar"><button class="mini" data-up>↑ 上一级</button><button class="mini" data-home>家目录</button><span class="fspath"></span></div>
        <div class="fslist"></div>
        <div class="fsnew"><input placeholder="新文件夹名称"><button class="mini" data-mk>在这里新建文件夹</button></div>
        <p class="note fserr warn"></p>
      </div>
      <footer><button class="btn" data-cancel>取消</button><button class="btn pri" data-ok>选择这个文件夹</button></footer></div>`;
    document.body.appendChild(mask);
    const q=x=>mask.querySelector(x); let cur=null;
    const done=v=>{ mask.remove(); resolve(v); };
    const err=t=>q(".fserr").textContent=t||"";
    async function go(path){
      if(mock){ cur=path||"~/projects"; q(".fspath").textContent=cur; q(".fslist").innerHTML='<div class="empty">演示模式下无法浏览本机文件夹</div>'; return; }
      try{ const r=await api("GET","/fs?path="+encodeURIComponent(path||"")); cur=r; err();
        q(".fspath").textContent=r.path.length>52?"…"+r.path.slice(-51):r.path; q(".fspath").title=r.path; q("[data-up]").disabled=!r.parent;
        q(".fslist").innerHTML=r.dirs.length?r.dirs.map((d,i)=>`<button data-i="${i}">${ico("folder")}${esc(d)}</button>`).join(""):'<div class="empty">（没有子文件夹）</div>';
        q(".fslist").querySelectorAll("button").forEach(b=>b.onclick=()=>go(r.path.replace(/\/$/,"")+"/"+r.dirs[+b.dataset.i]));
      }catch(e){ err(e.message); }
    }
    q("[data-up]").onclick=()=>cur&&cur.parent&&go(cur.parent);
    q("[data-home]").onclick=()=>go("~");
    q("[data-mk]").onclick=async()=>{ const name=q(".fsnew input").value.trim(); if(!name||mock) return;
      try{ const r=await api("POST","/fs/mkdir",{parent:cur.path,name}); q(".fsnew input").value=""; await go(r.path); }catch(e){ err(e.message); } };
    q(".fsnew input").onkeydown=e=>{ if(e.key==="Enter") q("[data-mk]").click(); };
    q(".x").onclick=q("[data-cancel]").onclick=()=>done(null);
    q("[data-ok]").onclick=()=>done(mock?cur:cur&&cur.path);
    mask.addEventListener("mousedown",e=>{ if(e.target===mask) done(null); });
    go(start);
  });
}
function openMemberModal(m){
  const g=S.group;
  $("#modal").innerHTML=`<header>${m?"编辑成员："+esc(m.name):"邀请模型进群"}<button class="x">×</button></header>
    <div class="body">${memberFormHTML(m||{provider:"claude_code",role:"developer"},0,false)}
      ${m?'<p class="note">保存后会关闭该成员当前终端并用新配置重启。</p>':'<p class="note">入群后会通知现有成员。</p>'}</div>
    <footer><button class="btn" data-close>取消</button><button class="btn pri" id="ok">${m?"保存并重启":"邀请"}</button></footer>`;
  const el=$("#modal .medit"); wireMemberForm(el);
  $("#ok").onclick=async()=>{ try{ const body=readMember(el);
      if(m) await api("PUT",`/groups/${g.id}/members/${m.id}`,body); else await api("POST",`/groups/${g.id}/members`,body);
      closeModal(); lastSig=""; refresh(); }catch(e){ alert(e.message); } };

}
function bindClose(){ $("#modal").querySelectorAll(".x,[data-close]").forEach(b=>b.onclick=closeModal); }

/* ═════════════ 事件 ═════════════ */
$("#newGroup").onclick=openGroupModal;
$("#glist").onclick=e=>{ const it=e.target.closest(".gitem"); if(it){ lastSig=""; openGroup(it.dataset.g); } };
document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{ S.tab=b.dataset.tab; renderPane(); });
$("#chips").onclick=e=>{ const c=e.target.closest(".chip"); if(!c) return; const inp=$("#input");
  inp.value=(inp.value&&!inp.value.endsWith(" ")?inp.value+" ":inp.value)+"@"+c.dataset.at+" "; inp.focus(); };
async function send(){
  const inp=$("#input"), text=inp.value.trim(); if(!text||!S.group) return;
  inp.value=""; autoGrow();
  try{ await api("POST",`/groups/${S.group.id}/messages`,{text}); await refresh(); $("#msgs").scrollTop=1e9; }
  catch(e){ alert(e.message); inp.value=text; }
}
function autoGrow(){ const t=$("#input"); t.style.height="auto"; t.style.height=Math.min(t.scrollHeight,160)+"px"; }
$("#send").onclick=send;
$("#input").addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){ e.preventDefault(); send(); } });
$("#input").addEventListener("input",autoGrow);
$("#mask").addEventListener("mousedown",e=>{ if(e.target.id==="mask") closeModal(); });

/* ═════════════ 启动 ═════════════ */
(async function boot(){
  try{ const r=await fetch("/api/health"); if(!r.ok) throw 0; S.health=await r.json(); if(!S.health.ok) throw 0; }
  catch{ mock=new Mock(); S.health=await mock.call("GET","/api/health"); }
  if(S.health.providers) PROVIDERS=S.health.providers;
  if(S.health.roles) ROLES=S.health.roles;
  if(S.health.models) MODELS={...MODELS,...S.health.models};
  renderTheme(); renderConn(); await loadGroups(); renderAll();
  if(S.groups[0]) openGroup(S.groups[0].id);
  setInterval(refresh,1500);
  setInterval(loadLog,3000);
  setInterval(loadUsage,10000);
  if(!mock) setInterval(async()=>{ try{ S.health=await api("GET","/health"); renderConn(); }catch{} },15000);
})();
